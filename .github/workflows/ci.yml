name: checks
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: volvox_test
          POSTGRES_USER: volvox
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volvox -d volvox_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: ruff check app alembic
      - run: mypy app
      - run: pytest ../../tests
        env:
          VOLVOX_TEST_DATABASE_URL: postgresql+psycopg://volvox:test-password@localhost:5432/volvox_test
      - run: python -m compileall -q app alembic
